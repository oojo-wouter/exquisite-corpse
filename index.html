<style>
/* Layout: one narrow paper column, like a folded sheet; everything in cobalt blue: cobalt on light paper, or light on cobalt in dark mode. */
:root{
  --paper:#f4f6fb; --ink:#0047ab; --grey:#6f83b3; --line:#cdd7ec; --wash:#e4eaf6; --card:#ffffff; --guide:#b4c3e4;
  --display:"Instrument Serif", "Times New Roman", serif;
  --ui:"Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
:root[data-theme="dark"]{--paper:#0047ab; --ink:#f4f6fb; --grey:#a9bfec; --line:#3a6fc4; --wash:#0d55be; --card:#003c92; --guide:#4f7fcf; color-scheme:dark}
.mode{position:fixed;z-index:25;top:calc(10px + env(safe-area-inset-top, 0px));right:max(12px, env(safe-area-inset-right, 0px));
  width:40px;height:40px;min-height:40px;padding:0;border-radius:50%;border:1.5px solid var(--ink);background:var(--paper);display:grid;place-items:center}
.mode.lang{right:calc(max(12px, env(safe-area-inset-right, 0px)) + 48px);font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--ink)}
.mode i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink);background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding-block:58px 40px;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.02}
h1{font-size:clamp(44px, 13vw, 64px);letter-spacing:-.01em}
h2{font-size:34px}
em{font-family:var(--display);font-style:italic;font-size:1.15em}
p{margin:0}
.lab{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey)}
.muted{color:var(--grey)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
hr{border:0;border-top:1px solid var(--line);margin:0;width:100%}

button,.btn{font:inherit;font-weight:500;border-radius:999px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);
  padding:11px 18px;cursor:pointer;min-height:44px;transition:background .15s,color .15s}
button.solid{background:var(--ink);color:var(--paper)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
button.ghost{border-color:transparent;padding-inline:10px}
button.wide{width:100%}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink);border-radius:14px;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:52px}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:14px;padding:6px 12px;min-height:36px;border-width:1px;border-color:var(--line);font-weight:400}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chip.kw{font-family:var(--display);font-style:italic;font-size:18px;border-color:var(--ink)}
input[type=text],textarea{font:inherit;width:100%;box-sizing:border-box;background:transparent;border:0;border-bottom:1.5px solid var(--ink);
  padding:8px 0;color:var(--ink);border-radius:0}
textarea{font-family:var(--display);font-size:30px;line-height:1.15;resize:none;min-height:80px}

.sheet{position:relative;background:var(--card);border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.sheet canvas{display:block;width:100%;height:auto;aspect-ratio:1000/700}
.tools{display:flex;justify-content:space-between;align-items:center;gap:8px}
.foldnote{font-family:var(--mono);font-size:11px;letter-spacing:.08em;color:var(--grey);text-transform:uppercase}
.wordfold{font-family:var(--display);font-size:22px;border-top:1.5px dashed var(--grey);padding-top:10px;color:var(--grey)}
.wordfold b{color:var(--ink);font-weight:400;font-style:italic}

.card{border:1.5px solid var(--ink);padding:20px;display:flex;flex-direction:column;gap:14px;background:var(--card)}
.quote{font-family:var(--display);font-size:30px;line-height:1.08}
.quote span{display:block}
.quote span+span{border-top:1px dashed var(--line);padding-top:4px;margin-top:4px}

.handoff{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:22px}
.fold-ill{height:90px;position:relative}
.fold-ill i{position:absolute;left:0;right:0;height:44px;border:1.5px solid var(--ink);background:var(--card)}
.fold-ill i:first-child{top:0;transform-origin:bottom;animation:fold 1.6s ease-in-out infinite alternate}
.fold-ill i:last-child{top:46px}
@keyframes fold{from{transform:perspective(400px) rotateX(0)}to{transform:perspective(400px) rotateX(-178deg)}}

.reveal{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line)}
.reveal .sec{transform-origin:top;transform:perspective(900px) rotateX(-92deg);opacity:0;transition:transform .9s cubic-bezier(.2,.7,.2,1),opacity .5s}
.reveal .wsec{transform:translateY(14px);transform-origin:top}
.reveal .wsec.open{transform:none}
.reveal .sec.open{transform:none;opacity:1}
.reveal canvas{display:block;width:100%;height:auto;aspect-ratio:1000/700}
.reveal .wsec{font-family:var(--display);font-size:clamp(30px, 9vw, 42px);line-height:1.05;padding:16px 20px;border-top:1px dashed var(--line)}
.reveal .wsec:first-child{border-top:0}
.credits{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--grey);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.linkbox{font-family:var(--mono);font-size:12px;background:var(--wash);padding:10px 12px;word-break:break-all;user-select:all;-webkit-user-select:all}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:999px;font-size:14px;z-index:20}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:3px;background:var(--line)}
.progress i.on{background:var(--ink)}
.wall{columns:2;column-gap:12px}
.wall>button{all:unset;box-sizing:border-box;display:block;width:100%;break-inside:avoid;margin-bottom:12px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:border-color .15s}
.wall>button:hover,.wall>button:focus-visible{border-color:var(--ink)}
.wall>button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wall canvas{display:block;width:100%;height:auto;aspect-ratio:1000/700}
.wall .wq{font-family:var(--display);font-size:21px;line-height:1.08;padding:14px 12px}
.ricon{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex:none}
.rules-played{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;color:var(--ink)}
.rules-played span{display:inline-flex;align-items:center;gap:4px}
.rule .rt .ricon{vertical-align:-2px;margin-right:6px}
.wall .tg{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey);padding:8px 12px 10px;border-top:1px dashed var(--line)}
.wall .wq+.tg{border-top:0}
.wall canvas.sq{aspect-ratio:1}
.wall .aicard{position:relative}
.wall .aitag{position:absolute;top:8px;left:8px}
.wall .wqs{font-size:15px;padding:4px 12px 10px}
.aibadge{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;line-height:1;padding:4px 7px 4px 5px;border:1px solid var(--ink);border-radius:999px;background:var(--card);color:var(--ink)}
.aibadge svg{width:11px;height:11px;fill:currentColor}
.aibtn{display:flex;align-items:center;justify-content:center;gap:10px}
.aibtn.busy .aibadge{display:none}
.aibtn.busy:disabled{opacity:1}
.pen-busy{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;margin-right:8px;display:inline-block;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.aibox{display:flex;flex-direction:column;gap:10px;animation:up .6s cubic-bezier(.2,.7,.2,1)}
.aihead{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--grey)}
#aican{display:block;width:100%;aspect-ratio:1;background:var(--card);border:1px solid var(--line)}
.aicap{font-size:12px;margin:0}
.sheetbg{position:fixed;inset:0;background:rgba(0,30,80,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.cheat{background:var(--paper);width:100%;max-width:560px;max-height:86vh;overflow:auto;border-top:1.5px solid var(--ink);box-sizing:border-box;
  padding:20px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:16px;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.art{display:grid;grid-template-columns:84px 1fr;gap:12px;border-top:1px solid var(--line);padding-top:14px}
.art .yr{font-family:var(--display);font-size:22px;line-height:1.1;white-space:nowrap}
.art .ti{font-family:var(--display);font-style:italic;font-size:22px;line-height:1.1}
.art .by{font-size:14px}
.art .md{font-size:13px;color:var(--grey)}
.art a{color:var(--ink);font-weight:500;font-size:14px;text-underline-offset:3px}
.steps{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line)}
.steps div{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:baseline;padding:10px 14px;font-size:14px;line-height:1.35}
.steps div+div{border-top:1.5px dashed var(--line)}
.steps b{font-family:var(--display);font-weight:400;font-size:24px;line-height:1}
.steps i{font-family:var(--display);font-size:17px}
.steps .end{grid-template-columns:1fr;color:var(--grey);font-size:13px}
.sharegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;box-sizing:border-box;text-align:center;font-size:14px;padding:10px 8px}
.loader{height:230px;display:flex;justify-content:center;align-items:flex-end;perspective:700px;padding-top:10px}
.lb{position:relative;width:150px;height:62px;background:var(--card);border:1.5px solid var(--ink);transform-style:preserve-3d;box-sizing:border-box}
.lb .lb{position:absolute;left:-1.5px;bottom:calc(100% + 1.5px);transform-origin:bottom}
.lb.b2{animation:f2 4.8s ease-in-out infinite}
.lb.b1{animation:f1 4.8s ease-in-out infinite}
.lb svg{color:var(--ink);position:absolute;inset:0;width:100%;height:100%;backface-visibility:hidden}
.lb .back{position:absolute;inset:0;background:var(--wash);transform:rotateX(180deg);backface-visibility:hidden}
@keyframes f1{0%,8%{transform:rotateX(0)}24%,76%{transform:rotateX(-179deg)}92%,100%{transform:rotateX(0)}}
@keyframes f2{0%,26%{transform:rotateX(0)}42%,64%{transform:rotateX(-179deg)}80%,100%{transform:rotateX(0)}}
.eye{animation:blink 2.4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.quip{font-family:var(--display);font-style:italic;font-size:26px;text-align:center;min-height:2.3em;transition:opacity .3s}
@media (prefers-reduced-motion: reduce){.lb.b1,.lb.b2,.eye{animation:none}}
.pens{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pen{width:34px;height:34px;min-height:34px;padding:0;border:1.5px solid transparent;border-radius:50%;display:grid;place-items:center;background:transparent}
.pen i{display:block;border-radius:50%;background:var(--ink)}
.pen.sw i{width:18px;height:18px;box-shadow:inset 0 0 0 1px rgba(127,127,127,.35)}
.pen[aria-pressed="true"]{border-color:var(--ink)}
.pensep{width:1px;height:22px;background:var(--line);margin-inline:2px}
.howto{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;counter-reset:st}
.howto div{border-top:1.5px solid var(--ink);padding-top:8px;font-size:13px;line-height:1.35;min-width:0}
.howto div::before{counter-increment:st;content:counter(st);display:block;font-family:var(--display);font-size:28px;line-height:1}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px}
button.warn{background:var(--ink);color:var(--paper)}
.obj{background:var(--card);border:1px solid var(--line);perspective:1100px;display:flex;justify-content:center;padding-block:36px;overflow:hidden;touch-action:pan-y;cursor:grab}
.rot{width:56%;display:flex;flex-direction:column;transform-style:preserve-3d}
.pb{position:relative;transform-style:preserve-3d}
.pb canvas{display:block;width:100%;height:auto;aspect-ratio:1000/700}
.pb .cp{position:absolute;inset:0}
.pb .wt{font-family:var(--display);font-size:clamp(22px,6.5vw,30px);line-height:1.05;padding:6px 0;color:var(--ink)}
.pb .wt.cp{color:var(--grey)}
.hint{font-size:13px;color:var(--grey);text-align:center}
/* test tabs on the start screen */
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1.5px solid var(--line)}
.tabs button{border:0;border-radius:0;border-bottom:3px solid transparent;margin-bottom:-1.5px;min-height:54px;padding:6px 4px;color:var(--grey);font-size:16px;line-height:1.15}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tabs small{display:block;font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;margin-bottom:2px}
.teaser{display:flex;flex-wrap:wrap;gap:6px}
.teaser span{font-family:var(--display);font-style:italic;font-size:17px;border:1px solid var(--ink);border-radius:999px;padding:2px 12px}
/* rule card: unfolds like paper, counter on the right, turns solid when used up */
.rule{border:1.5px solid var(--ink);background:var(--card);padding:14px 16px;display:grid;grid-template-columns:1fr auto;column-gap:14px;row-gap:3px;align-items:center;
  transform-origin:top;animation:ruleIn .8s cubic-bezier(.2,.7,.2,1);transition:background .3s,color .3s}
.rule>*{grid-column:1}
@keyframes ruleIn{from{transform:perspective(600px) rotateX(-90deg);opacity:0}}
.rule .rt{font-family:var(--display);font-style:italic;font-size:32px;line-height:1}
.rule .rd{font-size:13px;line-height:1.35;color:var(--grey)}
.rule .ctr{grid-column:2;grid-row:1/span 4;text-align:center;min-width:78px}
.ctr .big{font-family:var(--display);font-size:56px;line-height:.9;font-variant-numeric:tabular-nums}
.ctr .u{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--grey)}
.ctr .pips{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;max-width:96px;margin:6px auto 0}
.pips i{width:9px;height:9px;border-radius:50%;border:1.5px solid currentColor;box-sizing:border-box}
.pips i.on{background:currentColor}
.ctr.low .big{animation:pulse .8s infinite}
@keyframes pulse{50%{opacity:.3}}
.timebar{grid-column:1/-1!important;height:3px;background:var(--line);margin-top:8px}
.timebar i{display:block;height:100%;background:currentColor;transition:width .25s linear}
.ruleswap{justify-self:start;font-size:13px;min-height:32px;padding:4px 0;border:0}
.rule.over{background:var(--ink);color:var(--paper)}
.rule.over .rd,.rule.over .u{color:var(--paper);opacity:.8}
.rule.over .timebar{background:transparent}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pen svg{width:20px;height:20px;fill:currentColor;color:var(--ink)}
.pen.tool{border-color:var(--line)}
.pen.tool[aria-pressed="true"]{border-color:var(--ink);background:var(--wash)}
@media (prefers-reduced-motion: reduce){
  .rule,.ctr.low .big{animation:none}
  .reveal .sec{transition:none}
  .fold-ill i:first-child{animation:none}
}
</style>

function armTap(key,label,ask,fn){

// dots where the previous part's lines reach the fold
function foldDots(strokes){
  const xs=[];
  for(const s of strokes){ let best=null; for(let i=0;i<s.length;i+=2){ if(s[i+1]>=FOLD-10 && (!best||s[i+1]>best[1])) best=[s[i],s[i+1]]; } if(best) xs.push(best[0]); }
  xs.sort((a,b)=>a-b); const out=[];
  for(const x of xs){ if(!out.length||x-out[out.length-1]>45) out.push(x); }
  if(!out.length){ return pick([200,340,500,660,800],3).sort((a,b)=>a-b).map(x=>x+rnd(40)-20).map(x=>({x,random:true})); }
  return out.slice(0,7).map(x=>({x}));
}

function paint(ctx, strokes, opts={}){
  const BG=opts.light?"#ffffff":css("--card"), INK=opts.light?"#0047ab":css("--ink"), GUIDE=opts.light?"#b4c3e4":css("--guide"), MUTE=opts.light?"#6f83b3":css("--grey");

    ctx.strokeStyle=GUIDE; ctx.lineWidth=2; ctx.setLineDash([10,10]);
    if(!opts.last){ ctx.beginPath(); ctx.moveTo(0,FOLD); ctx.lineTo(W,FOLD); ctx.stroke();
      ctx.setLineDash([]); ctx.fillStyle=MUTE; ctx.font="500 20px Geist Mono, monospace"; ctx.fillText(T("FOLD · CARRY YOUR LINES DOWN HERE","VOUW · LAAT JE LIJNEN HIER DOORLOPEN"), 20, FOLD+40); }
    ctx.setLineDash([]);
  }
  if(opts.dots){ ctx.fillStyle=INK; for(const d of opts.dots){ ctx.beginPath(); ctx.arc(d.x,10,11,0,7); ctx.fill(); } }
  if(opts.start){ ctx.fillStyle=INK; for(const p of opts.start){ ctx.beginPath(); ctx.arc(p[0],p[1],7,0,7); ctx.fill(); } }

  for(let si=0; si<strokes.length; si++){ const s=strokes[si], code=opts.st?.[si]??10, lw=PEN_W[Math.floor(code/10)]??LW, cc=PEN_C[code%10]??"ink";
    ctx.strokeStyle=ctx.fillStyle=cc==="ink"?INK:cc; ctx.lineWidth=lw;
    ctx.beginPath();
    if(s.length<=2){ ctx.arc(s[0],s[1],lw/2,0,7); ctx.fill(); continue; }
    ctx.moveTo(s[0],s[1]);
    for(let i=2;i<s.length-2;i+=2){ const mx=(s[i]+s[i+2])/2, my=(s[i+1]+s[i+3])/2; ctx.quadraticCurveTo(s[i],s[i+1],mx,my); }

// graphite look: grainy pattern, thin line, two light passes
let grain=null;
function grainPattern(ctx){
  if(!grain){ grain=document.createElement("canvas"); grain.width=grain.height=48; const g=grain.getContext("2d"), im=g.createImageData(48,48);
    for(let i=0;i<im.data.length;i+=4){ const v=25+Math.random()*60; im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=110+Math.random()*145; } g.putImageData(im,0,0); }
  return ctx.createPattern(grain,"repeat");
}
function pencil(ctx, strokes){

  for(let pass=0;pass<2;pass++){
    ctx.lineWidth=pass?3:4.2; ctx.globalAlpha=pass?.55:.85;
    for(const s of strokes){ const o=pass?1.2:0; ctx.beginPath(); ctx.moveTo(s[0]+o,s[1]);
      for(let i=2;i<s.length-2;i+=2){ ctx.quadraticCurveTo(s[i]+o,s[i+1]-o,(s[i]+s[i+2])/2+o,(s[i+1]+s[i+3])/2-o); }
      ctx.lineTo(s[s.length-2]+o,s[s.length-1]); ctx.stroke(); }
  }

}

function mountPad(canvas, strokes, opts){
  const ctx=canvas.getContext("2d"); let cur=null, raf=0;
  const st=opts.st||[];
  const redraw=()=>{ raf=0;
    if(opts.blind){ paint(ctx, [], opts); if(cur){ const [x,y]=cur.slice(-2); ctx.strokeStyle=css("--grey"); ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,16,0,7); ctx.stroke(); } return; }
    paint(ctx, cur?[...strokes,cur]:strokes, {...opts, st:cur?[...st,penCode()]:st}); };
  const req=()=>{ if(!raf) raf=requestAnimationFrame(redraw); };
  const pos=e=>{ const r=canvas.getBoundingClientRect(); return [ (e.clientX-r.left)/r.width*W, (e.clientY-r.top)/r.height*H ]; };
  canvas.addEventListener("pointerdown",e=>{ if(cur) return; if(opts.canDraw && !opts.canDraw()){ opts.onBlocked?.(); return; } opts.onStart?.(); canvas.setPointerCapture(e.pointerId); cur=pos(e); req(); e.preventDefault(); });
  canvas.addEventListener("pointermove",e=>{ if(!cur) return; const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(const ev of evs){ const [x,y]=pos(ev); const lx=cur[cur.length-2], ly=cur[cur.length-1]; if(Math.hypot(x-lx,y-ly)>3) cur.push(Math.max(0,Math.min(W,x)),Math.max(0,Math.min(H,y))); } req(); });
  const end=()=>{ if(!cur) return; strokes.push(cur); st.push(penCode()); cur=null; req(); opts.onChange?.(); persist(); };
  canvas.addEventListener("pointerup",end); canvas.addEventListener("pointercancel",end);

}

// ---------- play over a link: the whole game travels inside the link ----------
const b64u = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64u = str => Uint8Array.from(atob(str.replace(/-/g,"+").replace(/_/g,"/")), c=>c.charCodeAt(0));
async function pipe(bytes, stream){ const out=await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer(); return new Uint8Array(out); }
async function packGame(g){
  const o={v:1,e:g.edition[0],t:g.theme,n:g.parts,s:startStr(g),p:g.turns.map(t=>[g.edition==="draw"?turnBody(g,t):t.text,t.name||"",t.rule||""])};
  const raw=new TextEncoder().encode(JSON.stringify(o));
  try{ return "z"+b64u(await pipe(raw,new CompressionStream("deflate-raw"))); }catch(e){ return "j"+b64u(raw); }
}
async function unpackGame(str){
  const kind=str[0], bytes=unb64u(str.slice(1));
  const raw = kind==="z" ? await pipe(bytes,new DecompressionStream("deflate-raw")) : bytes;
  const o=JSON.parse(new TextDecoder().decode(raw)), draw=o.e==="d";
  if(![3,4].includes(o.n)) throw new Error("bad game");
  const ps=parseStart(o.s), g={ id:"link", edition:draw?"draw":"words", theme:o.t, parts:o.n, tech:ps.tech, rules:ps.rules, oldGrid:ps.oldGrid, start:ps.start };
  g.turns=o.p.slice(0,o.n).map(([a,name,rule])=>({...(draw?turnFrom(g,String(a)):{text:String(a).slice(0,70)}), name:String(name).slice(0,24), rule:ruleById(rule)?rule:undefined}));
  return g;
}

async function routeHash(){
  const gm=/^#g-([a-z0-9]{8})$/.exec(location.hash);

    S.screen="loading"; render();

}

function updRule(){

}
function sameOk(){ const r=ruleById(S.draft?.rule); if(!r?.same) return true; const ws=S.draft.text.trim().split(/\s+/).filter(Boolean); const L=(ws[0]||"")[0]?.toLowerCase(); return ws.every(w=>w[0].toLowerCase()===L); }
function updWordsDone(){ const b=$("#done"); if(b) b.disabled=!S.draft.text.trim() || !sameOk(); }
function wordsInput(ta){
  const d=S.draft, r=ruleById(d.rule);
  if(timeUp()){ ta.value=d.text; return; }
  if(r?.secs && ta.value) startTimer();
  if(r?.noE && /[eéèêë]/i.test(ta.value)){ d.eHits=(d.eHits||0)+(ta.value.match(/[eéèêë]/gi)||[]).length; ta.value=ta.value.replace(/[eéèêë]/gi,""); ta.classList.remove("shake"); void ta.offsetWidth; ta.classList.add("shake"); }
  if(r?.words && wordCount(ta.value)>r.words){ ta.value=wordCount(d.text)<=r.words?d.text:ta.value.split(/\s+/).filter(Boolean).slice(0,r.words).join(" ")+" "; ta.classList.remove("shake"); void ta.offsetWidth; ta.classList.add("shake"); }
  if(ta.value) hideSwap();
  d.text=ta.value; persist(); updRule(); updWordsDone();
}
function updCount(){ const c=$("#cnt"); if(!c) return; const g=S.game, n=g.turns.length;
  if(isBlocks(g)){ const cs=S.draft.cells, k=cs.filter(b=>Math.floor(b.i/COLS)===BFOLD).length; $("#done").disabled=!cs.length;
    c.textContent=T(cs.length+" block"+(cs.length===1?"":"s"),cs.length+(cs.length===1?" blok":" blokken"))+(n===g.parts-1?"":T(" · "+k+" at the fold"," · "+k+" aan de vouw")); return; }
  if(n===g.parts-1){ c.textContent=""; $("#done").disabled=!S.draft.strokes.length; return; }
  const k=S.draft.strokes.filter(s=>s.some((v,i)=>i%2&&v>=FOLD-10)).length; c.textContent=T(k+" line"+(k===1?"":"s")+" at the fold",k+(k===1?" lijn":" lijnen")+" aan de vouw"); $("#done").disabled=!S.draft.strokes.length; }
function undo(){ if(isBlocks(S.game)){ const h=S.draft.hist.pop(); if(h!=null){ const v=JSON.parse(h); if(Array.isArray(v)) S.draft.cells=v; else { S.draft.cells=v.c; S.draft.eyes=v.e; } } pad?.redraw(); updCount(); persist(); return; }
  S.draft.strokes.pop(); S.draft.st?.pop(); pad?.redraw(); updCount(); persist(); }
function clearPad(){ if(isBlocks(S.game)){ S.draft.hist.push(blkSnap(S.draft)); S.draft.cells=[]; S.draft.eyes=[]; pad?.redraw(); updCount(); persist(); toast(T("Cleared","Gewist")); return; }
  S.draft.strokes.length=0; if(S.draft.st) S.draft.st.length=0; pad?.redraw(); updCount(); persist(); toast(T("Cleared","Gewist")); }
function reshuffle(){ const g=S.game, t=THEMES[g.theme]; S.draft.kws = g.edition==="draw"? pick(t.nouns,4) : kwFor(g.turns.length,t); render(); }
function useKw(k){
  if(S.game.edition==="draw"){ toast("Draw a "+k.toLowerCase()); return; }
  const ta=$("#txt"); ta.value=(ta.value.trim()+" "+k).trim(); S.draft.text=ta.value; $("#done").disabled=false; ta.focus();
}
async function finishTurn(){
  const g=S.game, d=S.draft, n=g.turns.length;
  const t={strokes:d.strokes, st:d.st||[], text:d.text.trim(), name:(d.name||"").trim()};
  if(isBlocks(g)){ t.cells=d.cells; t.eyes=d.eyes||[]; } if(d.rule) t.rule=d.rule;
  if(t.name) store.set("ec-name", t.name);
  if(S.mode==="remote" && hasDB()){
    $("#done").disabled=true;
    try{ if(n===0){ g.id=newId(); await dbCreate(g); } await dbTurn(g,n,t); }
    catch(e){ if(e.status===409){ toast(T("Someone already added this part. Loading the latest version.","Iemand heeft dit deel al toegevoegd. De laatste versie wordt geladen.")); return routeHash(); }
      toast(T("Could not save (","Opslaan lukte niet (")+(e.status||T("no connection","geen verbinding"))+"): "+(e.message||e), 9000); $("#done").disabled=false; return; }
    g.inDB=true; g.turns.push(t); S.draft=null; mine.add(g);
    LINK=location.origin+location.pathname+"#g-"+g.id; history.replaceState(null,"",location.pathname);
  } else if(S.mode==="remote"){
    g.turns.push(t); S.draft=null; await makeLink(g);
    history.replaceState(null,"",location.pathname);
  } else { g.turns.push(t); S.draft=null; }
  if(g.turns.length>=g.parts){ if(S.mode==="local") store.set("ec-game",""); return go("reveal"); }
  go(S.mode==="remote" ? "sent" : "handoff");
}

function handoff(){
  const g=S.game, n=g.turns.length;
  return `<div class="handoff">
    <div class="fold-ill"><i></i><i></i></div>
    <span class="lab">${T("Part","Deel")} ${n} ${T("done","klaar")}</span>
    <h2>${T("Fold. Pass the phone to the next player.","Vouw. Geef de gsm aan de volgende speler.")}</h2>
    <p class="muted">${T(`No peeking. The next player does the ${esc(partNames(g)[n].toLowerCase())} from ${foldHint(g)} only.`,`Niet spieken. De volgende speler doet het deel ‘${esc(partNames(g)[n].toLowerCase())}’ en ziet alleen ${foldHint(g)}.`)}</p>
    <button class="solid wide" onclick="go('turn')">${T("I'm the next player","Ik ben de volgende speler")}</button>
  </div>`;
}

function shareMsg(g){
  const done=g.turns.length, part=partNames(g)[done]?.toLowerCase();
  const lr=ruleById(g.turns[done-1]?.rule), tail=lr?" "+T(`My rule was “${ruleT(lr)[0]}”. Yours is a surprise.`,`Mijn regel was “${ruleT(lr)[0]}”. De jouwe is een verrassing.`):"";
  return (isBlocks(g)
    ? T(`I just built part ${done} of an exquisite corpse out of blocks. Can you build the ${part} without seeing the rest?`,`Ik bouwde net deel ${done} van een cadavre exquis met blokken. Bouw jij het deel ‘${part}’ zonder de rest te zien?`)
    : g.edition==="draw"
    ? T(`I just drew part ${done} of an exquisite corpse. Can you draw the ${part} without seeing the rest?`,`Ik tekende net deel ${done} van een cadavre exquis. Teken jij het deel ‘${part}’ zonder de rest te zien?`)
    : T(`I wrote part ${done} of an exquisite corpse sentence. Can you write the next line blind?`,`Ik schreef deel ${done} van een cadavre-exquiszin. Schrijf jij blind de volgende regel?`))+tail;
}
const shareText = g => shareMsg(g)+" "+gameLink(g);
const revealMsg = g => g.edition==="draw" ? T("Our exquisite corpse is finished. Unfold it:","Onze cadavre exquis is klaar. Vouw hem open:") : T("Our exquisite corpse sentence is finished. Read it:","Onze cadavre-exquiszin is klaar. Lees hem:");
function sent(){
  const g=S.game, link=gameLink(g);
  return `<div class="fold-ill"><i></i><i></i></div>
  <div class="stack" style="gap:4px"><span class="lab">${T("Folded","Gevouwen")} · ${g.turns.length} ${T("of","van")} ${g.parts} ${T("parts done","delen klaar")}</span>
  <h2>${T("Now send it to the next player","Stuur het nu naar de volgende speler")}</h2></div>
  <p>${T(`They will only see ${isBlocks(g)?"the bottom row of your blocks":g.edition==="draw"?"the dots where your lines cross the fold":"your last word"}. Whoever adds the last part gets the reveal and can send it back to everyone.`,`Die ziet alleen ${isBlocks(g)?"de onderste rij van jouw blokken":g.edition==="draw"?"de stippen waar jouw lijnen de vouw kruisen":"jouw laatste woord"}. Wie het laatste deel toevoegt, krijgt de onthulling en kan ze naar iedereen terugsturen.`)}</p>
  <div class="stack">
    ${navigator.share?`<button class="solid wide" onclick="shareLink(shareText(S.game),this)">${T("Share with the next player…","Deel met de volgende speler…")}</button><span class="lab">${T("Or pick an app","Of kies een app")}</span>`:`<span class="lab">${T("Send it with","Stuur het met")}</span>`}
    ${shareGrid(shareMsg(g), link, T("Your turn: exquisite corpse","Jouw beurt: cadavre exquis"))}
  </div>
  <button class="solid wide" onclick="sentIt()">${T("I've sent it","Ik heb het verstuurd")}</button>
  <button class="ghost" onclick="location.hash='';go('home')">${T("Back to start","Terug naar start")}</button>`;
}

// ---------- waiting screen: a paper that folds itself while the others play ----------
const QUIPS_L={en:["Folding the paper…","Someone is drawing a nose. Probably.","No peeking.","Sharpening the pencil…","Breton would be proud.","The corpse is getting exquisite…","Hiding your part under the fold…","Waiting for the next genius…"],
  nl:["Het papier wordt gevouwen…","Iemand tekent een neus. Waarschijnlijk.","Niet spieken.","Het potlood wordt geslepen…","Breton zou trots zijn.","Het lijk wordt steeds exquiser…","Jouw deel verdwijnt onder de vouw…","Wachten op het volgende genie…"]};
const QUIPS=new Proxy([], {get:(_,k)=>QUIPS_L[LANG][k]});
function waiting(){
  const g=S.game, left=g.parts-g.turns.length;
  const band=(d,eye)=>`<svg viewBox="0 0 150 62" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>${eye?`<ellipse class="eye" cx="75" cy="30" rx="9" ry="6" fill="none" stroke="currentColor" stroke-width="2"/><circle class="eye" cx="77" cy="30" r="2.4" fill="currentColor"/>`:""}</svg>`;
  return `<div class="loader" aria-hidden="true"><div class="lb">${band("M55 0 C60 20 50 40 62 62 M95 0 C90 25 100 45 88 62")}
      <div class="lb b2"><div class="back"></div>${band("M50 62 C40 40 60 25 70 15 C80 25 100 40 100 62 M45 40 L25 30 M105 40 L125 28")}
        <div class="lb b1"><div class="back"></div>${band("M45 62 C30 30 50 6 75 6 C100 6 120 30 105 62",true)}</div></div></div></div>
  <p class="quip" id="quip">${QUIPS[0]}</p>
  <div class="stack" style="gap:6px;text-align:center"><span class="lab" id="left">${T(`${left} more ${left===1?"player":"players"} to go`,`Nog ${left} ${left===1?"speler":"spelers"}`)}</span>
  <p class="muted" id="waitnote">${hasDB()?T("Keep this page open and the reveal appears here. You can also come back later: your games are listed on the start screen.","Laat deze pagina open, dan verschijnt de onthulling hier. Je kan ook later terugkomen: je spellen staan op het startscherm."):T("The last player gets the reveal. Ask them to send it back to you.","De laatste speler krijgt de onthulling. Vraag om ze naar jou terug te sturen.")}</p></div>
  <button class="ghost" onclick="location.hash='';go('home')">${T("Start a new game while you wait","Begin een nieuw spel terwijl je wacht")}</button>`;
}
let quipT=null;
let pollT=null;
function stopPoll(){ clearTimeout(pollT); pollT=null; }
function pollReveal(){
  stopPoll(); const g=S.game; if(!hasDB()||!g?.inDB) return;
  const tick=async()=>{
    if(S.screen!=="waiting"||S.game!==g) return;
    const n=await dbCount(g.id).catch(()=>null);
    if(n!==null){ const left=g.parts-n, el=$("#left"); if(el) el.textContent=left>0?T(`${left} more ${left===1?"player":"players"} to go`,`Nog ${left} ${left===1?"speler":"spelers"}`):T("Everyone is done","Iedereen is klaar");
      if(left<=0){ return revealReady(g); } }
    pollT=setTimeout(tick, document.hidden?20000:6000);
  };
  pollT=setTimeout(tick,4000);
}
function revealReady(g){
  document.title=T("● Reveal ready · Exquisite Corpse","● Klaar om te onthullen · Cadavre exquis");
  try{ if(window.Notification && Notification.permission==="granted") new Notification(T("Your exquisite corpse is finished","Je cadavre exquis is klaar"),{body:T("Tap to unfold the reveal.","Tik om open te vouwen.")}).onclick=()=>{ focus(); openGame(g.id); }; }catch(e){}
  const q=$("#quip"); if(q){ clearInterval(quipT); q.textContent=T("It's finished.","Het is klaar."); }
  const note=$("#waitnote"); if(note) note.innerHTML=`<button class="solid wide" onclick="openGame('${g.id}')">${T("Unfold the reveal","Vouw open")}</button>`;
}
function sentIt(){
  try{ if(hasDB() && window.Notification && Notification.permission==="default") Notification.requestPermission(); }catch(e){}
  go("waiting");
}
after.waiting=()=>{ pollReveal(); clearInterval(quipT); let i=0; quipT=setInterval(()=>{ const q=$("#quip"); if(!q){ clearInterval(quipT); return; } q.style.opacity=0; setTimeout(()=>{ i=(i+1)%QUIPS.length; q.textContent=QUIPS[i]; q.style.opacity=1; },300); },2600); };

function join(){
  const g=S.game, n=g.turns.length, names=partNames(g);
  const who=g.turns.map(t=>t.name).filter(Boolean);
  return `<div class="fold-ill"><i></i><i></i></div>
  <span class="lab">${g.edition==="draw"?T("Drawing","Tekenen"):T("Words","Woorden")}</span>
  <h2>${T(`${who.length?esc(who.join(", "))+" folded":"Someone folded"} this paper for you`,`${who.length?esc(who.join(", "))+" vouwde":"Iemand vouwde"} dit papier voor jou`)}</h2>
  <p>${T(`You're adding part ${n+1} of ${g.parts}: the <b>${esc(names[n].toLowerCase())}</b>. You won't see what came before, only ${foldHint(g)}.`,`Jij voegt deel ${n+1} van ${g.parts} toe: <b>${esc(names[n].toLowerCase())}</b>. Je ziet niet wat ervoor kwam, alleen ${foldHint(g)}.`)}</p>
  <button class="solid wide" onclick="S.draft=null;go('turn')">${T("Unfold my part","Open mijn deel")}</button>`;
}

function reveal(){
  const g=S.game, who=g.turns.map((t,i)=>t.name||(T("Player ","Speler ")+(i+1)));
  const body = g.edition==="draw"
    ? g.turns.map((t,i)=>`<div class="sec"><canvas data-i="${i}"></canvas></div>`).join("")
    : g.turns.map(t=>`<div class="sec wsec">${esc(t.text)}</div>`).join("");
  const ex=S.mode==="wall";
  return `${ex?`<button class="ghost chip" style="align-self:flex-start;padding-left:0" onclick="go('home');setTimeout(()=>$('#wall-top')?.scrollIntoView(),400)">← ${T("Back to the wall","Terug naar de muur")}</button>`:""}
  <div class="stack" style="gap:4px"><span class="lab">${ex?T("From the wall","Van de muur"):T("Unfolded","Opengevouwen")}</span><h2>${T("The reveal","De onthulling")}</h2></div>
  <div class="reveal" id="rv">${body}</div>
  <div class="credits">${who.map((w,i)=>`<span>${esc(partNames(g)[i])} · ${esc(w)}${g.turns[i].rule&&ruleById(g.turns[i].rule)?` · ${ruleIcon(g.turns[i].rule,13)} `+esc(ruleT(ruleById(g.turns[i].rule))[0]):""}</span>`).join("")}</div>
  ${g.edition==="words"?aiBlock(g, ex):""}
  <div class="stack">
    ${hasDB()&&!ex?`<button class="solid wide" ${g.onWall?"disabled":""} onclick="publishToWall(this)">${g.onWall?T("On the wall","Op de muur"):T("Publish to wall","Op de muur zetten")}</button>`:""}
    <button class="${hasDB()&&!ex?"":"solid "}wide" onclick="saveImage(this)">${T("Save image","Bewaar afbeelding")}</button>
    ${g.edition==="words"?`<button class="wide" onclick="copy(wordsText(S.game),this)">${T("Copy the sentence","Kopieer de zin")}</button>`:""}
    ${S.mode==="remote"||ex?`<div class="stack"><span class="lab">${ex?T("Share it","Deel het"):T("Send the reveal to everyone","Stuur de onthulling naar iedereen")}</span>
      ${navigator.share?`<button class="wide" onclick="revealShare(this)">${T("Share…","Delen…")}</button>`:""}
      ${shareGrid(revealMsg(g), LINK, T("Our exquisite corpse is finished","Onze cadavre exquis is klaar"))}</div>`:""}
    <button class="ghost wide" onclick="location.hash='';S.game=null;go('home')">${ex?T("Make your own","Maak je eigen"):T("Play again","Opnieuw spelen")}</button>
  </div>`;
}
after.reveal=()=>{
  const g=S.game;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const canv=[...document.querySelectorAll("#rv canvas")];
  const draw=(c,t)=>paintPart(c.getContext("2d"), g, +c.dataset.i, t);
  canv.forEach(c=>{ sizeCanvas(c); draw(c, reduce?1:0); });
  const secs=[...document.querySelectorAll("#rv .sec")];
  secs.forEach((s,i)=>{
    if(reduce){ s.classList.add("open"); return; }
    setTimeout(()=>{ s.classList.add("open"); const c=s.querySelector("canvas"); if(!c) return;
      const t0=performance.now(), D=1100; const step=now=>{ if(!c.isConnected) return; const t=Math.min(1,(now-t0)/D); draw(c, 1-Math.pow(1-t,2)); if(t<1) requestAnimationFrame(step); }; requestAnimationFrame(step); }, 300+i*900);
  });
  const ac=$("#aican"); if(ac){ const fresh=g.ai.fresh&&!reduce; g.ai.fresh=false; paintAI(ac,g,fresh?0:1);
    if(fresh){ const t0=performance.now(), D=2600; const step=now=>{ if(!ac.isConnected) return; const t=Math.min(1,(now-t0)/D); paintAI(ac,g,1-Math.pow(1-t,2)); if(t<1) requestAnimationFrame(step); }; requestAnimationFrame(step); } }
  const cr=document.querySelector(".credits"); if(cr && !reduce){ cr.style.opacity=0; cr.style.transition="opacity .8s"; setTimeout(()=>cr.style.opacity=1, 300+secs.length*900+400); }
};
// the first fraction t of all points, so lines draw themselves in the order they were made
function partial(strokes,t){
  if(t>=1) return strokes; const total=strokes.reduce((a,s)=>a+s.length,0); let left=Math.floor(total*t/2)*2; const out=[];
  for(const s of strokes){ if(left<=0) break; out.push(s.length<=left?s:s.slice(0,Math.max(2,left))); left-=s.length; }
  return out;
}
let spin=0;
function build3d(){
  const g=S.game, rot=$("#rot"), COPIES=5, DEPTH=[0,-38,22,-26];
  g.turns.forEach((t,i)=>{
    const pb=document.createElement("div"); pb.className="pb";
    for(let k=0;k<COPIES;k++){
      const z=DEPTH[i%4]-k*3;
      if(g.edition==="draw"){
        const c=document.createElement("canvas"); c.width=600; c.height=420; if(k) c.className="cp";
        c.style.transform=`translateZ(${z}px)`; pb.appendChild(c);
        paint(c.getContext("2d"), t.strokes, {st:t.st, clear:true, start:i===0?g.start:null, pencil:g.pencil});
      }else{
        const d=document.createElement("div"); d.className="wt"+(k?" cp":""); d.textContent=t.text; d.style.transform=`translateZ(${z}px)`; pb.appendChild(d);
      }
    }
    rot.appendChild(pb);
  });
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let ang=-25, drag=null, id=++spin;
  const obj=$("#obj");
  const tick=()=>{ if(id!==spin||!rot.isConnected) return; if(!drag&&!reduce) ang+=0.35; rot.style.transform=`rotateX(-8deg) rotateY(${ang}deg)`; requestAnimationFrame(tick); };
  obj.addEventListener("pointerdown",e=>{ drag={x:e.clientX,a:ang}; obj.setPointerCapture(e.pointerId); });
  obj.addEventListener("pointermove",e=>{ if(drag) ang=drag.a+(e.clientX-drag.x)*0.6; });
  const up=()=>drag=null; obj.addEventListener("pointerup",up); obj.addEventListener("pointercancel",up);
  rot.style.transform=`rotateX(-8deg) rotateY(${ang}deg)`; tick();
}
const wordsText = g => g.turns.map(t=>t.text).join(" ").replace(/\s+/g," ").trim().replace(/^./,c=>c.toUpperCase()).replace(/([^.!?])$/,"$1.");

async function composeImage(){
  await document.fonts?.ready;
  const g=S.game, M=70, names=g.turns.map((t,i)=>t.name||(T("Player ","Speler ")+(i+1)));
  const c=document.createElement("canvas"); const x=c.getContext("2d");
  if(g.edition==="draw"){
    c.width=W+M*2; c.height=H*g.parts+M*2+60;
    x.fillStyle="#f4f6fb"; x.fillRect(0,0,c.width,c.height);
    g.turns.forEach((t,i)=>{ const sc=document.createElement("canvas"); sc.width=W; sc.height=H; paintPart(sc.getContext("2d"), g, i, 1, {light:true}); x.drawImage(sc,M,M+i*H); });
  }else{
    c.width=1140; const lines=[]; x.font="68px 'Instrument Serif', serif";
    g.turns.forEach(t=>{ let line=""; for(const w of t.text.split(/\s+/)){ const tr=(line+" "+w).trim(); if(x.measureText(tr).width>c.width-M*2 && line){ lines.push(line); line=w; } else line=tr; } lines.push(line); lines.push(""); });
    lines.pop(); c.height=M*2+lines.length*80+80;
    x.fillStyle="#f4f6fb"; x.fillRect(0,0,c.width,c.height); x.fillStyle="#0047ab"; x.font="68px 'Instrument Serif', serif";
    lines.forEach((l,i)=>x.fillText(l,M,M+60+i*80));
  }
  x.fillStyle="#6f83b3"; x.font="500 20px 'Geist Mono', monospace";
  x.fillText((T("EXQUISITE CORPSE · ","CADAVRE EXQUIS · ")+(g.edition==="draw"&&g.tags?g.theme+" · ":"")+names.join(", ")).toUpperCase(), M, c.height-M+10);
  return new Promise(r=>c.toBlob(r,"image/png"));
}
async function saveImage(btn){
  btn.disabled=true;
  try{
    const blob=await composeImage();
    const file=new File([blob],"exquisite-corpse.png",{type:"image/png"});
    if(navigator.canShare?.({files:[file]})){ try{ await navigator.share({files:[file]}); }catch(e){} }
    else { const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=file.name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
  }catch(e){ toast(T("The image was not saved.","De afbeelding is niet bewaard.")); }
  btn.disabled=false;
}

async function revealShare(btn){
  const g=S.game; if(!LINK) await makeLink(g);
  shareLink(revealMsg(g)+" "+LINK, btn);
}
function applyTheme(t){ document.documentElement.dataset.theme=t; const b=$("#mode"); if(b) b.setAttribute("aria-label", t==="dark"?T("Switch to light mode","Naar lichte modus"):T("Switch to dark mode","Naar donkere modus"));
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content", t==="dark"?"#0047ab":"#f4f6fb"); }
function toggleTheme(){ const t=document.documentElement.dataset.theme==="dark"?"light":"dark"; store.set("ec-theme",t); applyTheme(t);
  if(S.screen==="turn") pad?.redraw();
  if(S.screen==="home") loadWall(); if(S.screen==="reveal") render(); }
applyLang();
applyTheme(store.get("ec-theme") || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
render();
routeHash();
</script>
