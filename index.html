<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Glitch: draw or write one part, fold, pass it on, unfold the whole thing together.">
<meta property="og:title" content="Glitch"><meta property="og:description" content="Someone folded this paper for you. Add your part without seeing the rest.">
<meta name="theme-color" content="#f4f6fb">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Glitch</title>
<link rel="icon" href="icons/glitch.svg" type="image/svg+xml">
<link rel="icon" href="icons/glitch-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/glitch-touch-180.png">
<link rel="manifest" href="icons/manifest.webmanifest?v=2">
<link rel="preload" href="images/glitch-title.webp" as="image" type="image/webp">
<meta name="apple-mobile-web-app-title" content="Glitch">
<meta property="og:image" content="https://oojo-wouter.github.io/exquisite-corpse/icons/glitch-1024.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap">
<style>
/* Layout: one narrow paper column, like a folded sheet; everything in cobalt blue: cobalt on light paper, or light on cobalt in dark mode. */
:root{
  --paper:#f4f6fb; --ink:#0047ab; --grey:#6f83b3; --line:#cdd7ec; --wash:#e4eaf6; --card:#ffffff; --guide:#b4c3e4;
  /* Type: MKRS design system. Space Grotesk for everything, oojo.be web scale (light 300 display lines, negative tracking, uppercase labels at 0.5px). */
  --sans:"Space Grotesk", Arial, Helvetica, sans-serif;
  --display:var(--sans); --ui:var(--sans); --mono:var(--sans);
}
:root[data-theme="dark"]{--paper:#0047ab; --ink:#f4f6fb; --grey:#a9bfec; --line:#3a6fc4; --wash:#0d55be; --card:#003c92; --guide:#4f7fcf; color-scheme:dark}
.mode{position:fixed;z-index:25;top:calc(10px + env(safe-area-inset-top, 0px));right:max(12px, env(safe-area-inset-right, 0px));
  width:40px;height:40px;min-height:40px;padding:0;border-radius:50%;border:1.5px solid var(--ink);background:var(--paper);display:grid;place-items:center}
.mode.lang{right:calc(max(12px, env(safe-area-inset-right, 0px)) + 48px);font-family:var(--mono);font-size:12px;font-weight:500;letter-spacing:.5px;color:var(--ink)}
.mode i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--ink);background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}
.mode.adm{right:calc(max(12px, env(safe-area-inset-right, 0px)) + 96px);color:var(--ink)}
.mode.adm svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mode.adm[aria-current="page"]{background:var(--ink);color:var(--paper)}
/* screen 1: title, swipeable mood images, play */
.intro{min-height:calc(100svh - 98px);display:flex;flex-direction:column;gap:18px}
.intro h1{font-weight:700;letter-spacing:-.04em;text-transform:uppercase}
/* hand-drawn title: the image is only a mask, so the ink follows the theme (cobalt on light, light on cobalt) */
.logo{width:100%;max-width:460px;aspect-ratio:1000/214;margin-inline:auto;color:transparent;overflow:hidden;background:var(--ink);
  -webkit-mask:url(images/glitch-title.webp) center/contain no-repeat;mask:url(images/glitch-title.webp) center/contain no-repeat}
.base{font-family:var(--display);font-weight:300;font-size:23px;line-height:30px;letter-spacing:-.575px;margin-top:4px;text-align:center;text-transform:uppercase}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;background:transparent;-webkit-mask:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);mask:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.car::-webkit-scrollbar{display:none}
/* start screen takes the images' own background, so they sit on the page without a frame */
:root.intro-on{--paper:#fefefe}
:root.intro-on[data-theme="dark"]{--paper:#0144a1}
.car figure{flex:0 0 100%;margin:0;scroll-snap-align:center;scroll-snap-stop:always}
.car img{display:block;width:100%;height:clamp(240px, calc(100svh - 420px), 620px);object-fit:cover;object-position:50% 62%;user-select:none;-webkit-user-drag:none}
.dots{display:flex;justify-content:center;gap:2px;margin-top:-8px}
.dots button{min-height:32px;width:32px;padding:0;border:0;display:grid;place-items:center}
.dots button i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--ink);box-sizing:border-box}
.dots button[aria-current="true"] i{background:var(--ink)}
button.play{border-radius:0;width:100%;min-height:64px;display:flex;justify-content:center;gap:14px;align-items:center;padding:0 22px;font-size:20px;font-weight:700;letter-spacing:2px;margin-top:auto}
button.play svg{width:28px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:square}
/* quit as a bold X */
button.quit{width:44px;min-width:44px;padding:0;display:grid;place-items:center;border-color:transparent}
button.quit svg{width:20px;height:20px;stroke:currentColor;stroke-width:3.2;stroke-linecap:square;fill:none}
button.quit.warn{width:auto;padding:0 14px;font-size:13px}
button.back{padding-left:0}
/* admin */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line)}
.kpi{background:var(--card);padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi b{font-family:var(--display);font-weight:300;font-size:40px;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.kpi small{font-size:12px;line-height:1.3;color:var(--grey)}
.insights{display:flex;flex-direction:column;border-top:1.5px solid var(--ink)}
.insights p{padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px;line-height:1.4}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:14px}
.hbar .tr{grid-column:1/-1;height:10px;background:var(--wash)}
.hbar .tr i{display:block;height:100%;background:var(--ink);border-radius:0 4px 4px 0;min-width:2px}
.hbar span:nth-child(2){font-variant-numeric:tabular-nums}
.days{display:grid;grid-template-columns:repeat(14,1fr);gap:2px;align-items:end;height:120px;border-bottom:1px solid var(--line)}
.days div{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:stretch;cursor:default}
.days i{display:block;background:var(--ink);border-radius:4px 4px 0 0;min-height:0}
.days div:hover i,.days div:focus-visible i{opacity:.7}
.daylab{display:flex;justify-content:space-between;font-size:11px;color:var(--grey);letter-spacing:.5px;text-transform:uppercase}
.toplist div{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding:6px 0;font-size:14px}
.toplist span:last-child{font-variant-numeric:tabular-nums}
/* magic pop-up: pops in, sparkles burst, the rules unfold one by one */
.magicbg{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(0,30,80,.55);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fadein .25s ease-out}
@keyframes fadein{from{opacity:0}}
.magic{position:relative;background:var(--paper);border:1.5px solid var(--ink);width:100%;max-width:440px;max-height:calc(100svh - 32px);overflow:auto;box-sizing:border-box;padding:28px 20px 20px;display:flex;flex-direction:column;gap:12px;
  animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{0%{transform:scale(.6) rotate(-4deg);opacity:0}60%{opacity:1}100%{transform:none}}
.wand{width:44px;height:44px;fill:var(--ink);animation:twirl 1.1s cubic-bezier(.2,.8,.2,1) both,glow 2.4s 1.1s ease-in-out infinite}
@keyframes twirl{from{transform:rotate(-200deg) scale(0)}to{transform:none}}
@keyframes glow{50%{transform:scale(1.12) rotate(12deg)}}
.spark{position:absolute;left:42px;top:50px;width:0;height:0;pointer-events:none}
.spark i{position:absolute;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--ink);opacity:0;animation:burst .9s calc(.25s + var(--d)) ease-out forwards;transform:rotate(var(--a))}
@keyframes burst{0%{opacity:1;transform:rotate(var(--a)) translateX(0) scale(1)}100%{opacity:0;transform:rotate(var(--a)) translateX(70px) scale(.3)}}
.mrules{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.mrules div{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;padding:9px 0;border-bottom:1px dashed var(--line);
  transform-origin:top;animation:ruleIn .6s calc(.35s + var(--i)*.09s) cubic-bezier(.2,.7,.2,1) both}
.mrules .ricon{margin-top:3px}
.mrules b{display:block;font-family:var(--display);font-weight:400;font-size:19px;line-height:1.2;letter-spacing:-.3px}
.mrules small{display:block;font-size:13px;line-height:1.35;color:var(--grey)}
.mbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.mbtns button{border-radius:0;min-height:52px;font-weight:700;letter-spacing:1px}
@media (prefers-reduced-motion: reduce){.magicbg,.magic,.wand,.spark i,.mrules div{animation:none}.spark{display:none}}
/* admin lock: same pop-up, asks a password; a wrong one glows the screen red */
.lockico{width:44px;height:44px;fill:none;stroke:var(--ink);stroke-width:1.6;animation:twirl 1.1s cubic-bezier(.2,.8,.2,1) both}
.magic input[type=password]{font:inherit;font-size:20px;width:100%;box-sizing:border-box;background:transparent;border:0;border-bottom:1.5px solid var(--ink);padding:10px 0;color:var(--ink);border-radius:0;outline:none}
.magic input[type=password][aria-invalid="true"]{border-bottom-color:#e0002a}
.lockerr{min-height:18px;margin:-4px 0 0;font-size:13px;font-weight:700;color:#e0002a}
:root[data-theme="dark"] .lockerr{color:#ff8a9a}
:root[data-theme="dark"] .magic input[type=password][aria-invalid="true"]{border-bottom-color:#ff8a9a}
.redglow{position:fixed;inset:0;z-index:31;pointer-events:none;box-shadow:inset 0 0 90px 30px rgba(230,0,40,.75);animation:redglow .9s ease-out forwards}
@keyframes redglow{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
.magic.shake{animation:shake .4s cubic-bezier(.36,.07,.19,.97) both}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@media (prefers-reduced-motion: reduce){.lockico,.magic.shake{animation:none}.redglow{animation-duration:1.4s}}
button.play.second{min-height:52px;font-size:15px;letter-spacing:1.5px;margin-top:-8px;background:transparent;color:var(--ink)}
.toolpick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{border-radius:0;border:1.5px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:14px;text-transform:none;letter-spacing:0;text-align:left;line-height:1.3;min-height:0}
.tool svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.tool[aria-checked="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.tool .tn{font-family:var(--display);font-size:23px;font-weight:400;letter-spacing:-.5px}
.tool .lvl{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:500;letter-spacing:.5px;text-transform:uppercase}
.tool .bars{display:flex;gap:2px;align-items:flex-end}
.tool .bars i{width:4px;border:1px solid currentColor;box-sizing:border-box}
.tool .bars i:nth-child(1){height:6px}.tool .bars i:nth-child(2){height:9px}.tool .bars i:nth-child(3){height:12px}
.tool .bars i.on{background:currentColor}
.tool small{font-size:12px;opacity:.75}
.sheet{overflow:hidden}
.sheet canvas{transform-origin:0 0;will-change:transform}
.sheet.panning canvas{cursor:grab}
.zoombar{position:absolute;top:8px;right:8px;display:flex;gap:4px;z-index:2}
.zoombar button{width:36px;height:36px;min-height:36px;padding:0;border-radius:50%;display:grid;place-items:center;background:var(--card);font-size:20px;line-height:1;font-weight:500;border-width:1.5px}
.zoombar button:disabled{opacity:.3}
.zoombar button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.zoombar svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.iapp{display:flex;flex-direction:column;align-items:center;gap:6px;align-self:center;margin:4px 0 6px;animation:float 3s 1.1s ease-in-out infinite}
.iapp img{width:84px;height:84px;border-radius:19px;box-shadow:0 10px 30px rgba(0,30,90,.35);animation:appin .9s cubic-bezier(.2,1.5,.4,1) both}
.iapp span{font-size:12px;letter-spacing:.3px;animation:fadein .4s .6s both}
@keyframes appin{0%{transform:translateY(60px) scale(.3) rotate(-18deg);opacity:0}70%{opacity:1}100%{transform:none}}
@keyframes float{50%{transform:translateY(-5px)}}
.ispark{left:50%;top:70px}
.isteps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.isteps li{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:baseline;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px;line-height:1.4;animation:ruleIn .6s calc(.5s + var(--i)*.12s) cubic-bezier(.2,.7,.2,1) both;transform-origin:top}
.isteps b{font-family:var(--display);font-weight:700;font-size:20px;line-height:1}
.ish{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
@media (prefers-reduced-motion: reduce){.iapp,.iapp img,.iapp span,.isteps li{animation:none}}
.mclose{position:absolute;top:8px;right:8px;width:44px;height:44px;min-height:44px;padding:0;border:0;display:grid;place-items:center;z-index:1}
.mclose svg{width:18px;height:18px;stroke:currentColor;stroke-width:3.2;stroke-linecap:square;fill:none}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:25px;font-weight:400;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding-block:58px 40px;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:clamp(44px, 13vw, 64px);line-height:1;font-weight:300;letter-spacing:-.025em}
h2{font-size:30px;line-height:33.75px;letter-spacing:-.75px}
em{font-family:var(--display);font-style:normal;font-weight:700}
p{margin:0}
.lab{font-family:var(--mono);font-size:12px;line-height:18px;letter-spacing:.5px;text-transform:uppercase;color:var(--grey)}
.muted{color:var(--grey)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
hr{border:0;border-top:1px solid var(--line);margin:0;width:100%}

button,.btn{font:inherit;font-weight:400;text-transform:uppercase;letter-spacing:.5px;line-height:16px;border-radius:0;border:1.5px solid var(--ink);background:transparent;color:var(--ink);
  padding:11px 18px;cursor:pointer;min-height:44px;transition:background .15s,color .15s}
button.solid{background:var(--ink);color:var(--paper)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
button.ghost{border-color:transparent;padding-inline:10px}
button.wide{width:100%}
/* main buttons look like the start screen: square, primary (solid) 64px, secondary 52px */
button.wide{border-radius:0;min-height:52px;font-size:15px;font-weight:700;letter-spacing:1.5px;line-height:1.2;display:flex;justify-content:center;align-items:center;gap:10px;padding:8px 18px;text-align:center}
button.wide.solid{min-height:64px;font-size:20px;letter-spacing:2px}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--ink);border-radius:0;overflow:hidden}
.seg button{border:0;border-radius:0;min-height:52px}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;padding:6px 12px;min-height:36px;border-width:1px;border-color:var(--line);font-weight:400}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chip.kw{font-family:var(--display);text-transform:none;letter-spacing:-.3px;font-weight:300;font-size:18px;border-color:var(--ink)}
input[type=text],textarea{font:inherit;width:100%;box-sizing:border-box;background:transparent;border:0;border-bottom:1.5px solid var(--ink);
  padding:8px 0;color:var(--ink);border-radius:0}
textarea{font-family:var(--display);font-size:30px;line-height:33.75px;font-weight:300;letter-spacing:-.75px;resize:none;min-height:80px}

.sheet{position:relative;background:var(--card);border:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.sheet canvas{display:block;width:100%;height:auto;aspect-ratio:1000/700}
.tools{display:flex;justify-content:space-between;align-items:center;gap:8px}
.foldnote{font-family:var(--mono);font-size:12px;letter-spacing:.5px;color:var(--grey);text-transform:uppercase}
.wordfold{font-family:var(--display);font-size:23px;line-height:30px;font-weight:300;letter-spacing:-.575px;border-top:1.5px dashed var(--grey);padding-top:10px;color:var(--grey)}
.wordfold b{color:var(--ink);font-weight:500}

.card{border:1.5px solid var(--ink);padding:20px;display:flex;flex-direction:column;gap:14px;background:var(--card)}
.quote{font-family:var(--display);font-size:30px;line-height:33.75px;font-weight:300;letter-spacing:-.75px}
.quote span{display:block}
.quote span+span{border-top:1px dashed var(--line);padding-top:4px;margin-top:4px}

.handoff{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:22px}
.fold-ill{height:90px;position:relative}
.fold-ill i{position:absolute;left:0;right:0;height:44px;border:1.5px solid var(--ink);background:var(--card)}
.fold-ill i:first-child{top:0;transform-origin:bottom;animation:fold 1.6s ease-in-out infinite alternate}
.fold-ill i:last-child{top:46px}
@keyframes fold{from{transform:perspective(400px) rotateX(0)}to{transform:perspective(400px) rotateX(-178deg)}}

.reveal{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line)}
.reveal .sec{transform-origin:top;transform:perspective(900px) rotateX(-92deg);opacity:0;transition:transform .9s cubic-bezier(.2,.7,.2,1),opacity .5s}
.reveal .wsec{transform:translateY(14px);transform-origin:top}
.reveal .wsec.open{transform:none}
.reveal .sec.open{transform:none;opacity:1}
.reveal canvas{display:block;width:100%;height:auto;aspect-ratio:1000/700}
.reveal .wsec{font-family:var(--display);font-size:clamp(30px, 9vw, 44px);line-height:1.05;font-weight:300;letter-spacing:-.025em;padding:16px 20px;border-top:1px dashed var(--line)}
.reveal .wsec:first-child{border-top:0}
.credits{font-family:var(--mono);font-size:12px;letter-spacing:.5px;text-transform:uppercase;color:var(--grey);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.linkbox{font-family:var(--mono);font-size:12px;background:var(--wash);padding:10px 12px;word-break:break-all;user-select:all;-webkit-user-select:all}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:999px;font-size:14px;z-index:20}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:3px;background:var(--line)}
.progress i.on{background:var(--ink)}
.wall{columns:2;column-gap:12px}
.wall>button{all:unset;box-sizing:border-box;display:block;width:100%;break-inside:avoid;margin-bottom:12px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:border-color .15s}
.wall>button:hover,.wall>button:focus-visible{border-color:var(--ink)}
.wall>button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wall canvas{display:block;width:100%;height:auto;aspect-ratio:1000/700}
.wall .wq{font-family:var(--display);font-size:20px;line-height:1.15;font-weight:300;letter-spacing:-.4px;padding:14px 12px}
.ricon{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;flex:none}
.rules-played{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:6px;color:var(--ink)}
.rules-played span{display:inline-flex;align-items:center;gap:4px}
.rule .rt .ricon{vertical-align:-2px;margin-right:6px}
.eyesbtn{display:flex;align-items:center;justify-content:center;gap:10px}
.eyesbtn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.eyecnt{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;opacity:.75}
.wall .tg{font-family:var(--mono);font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--grey);padding:8px 12px 10px;border-top:1px dashed var(--line)}
.wall .wq+.tg{border-top:0}

function seedCells(){ const a=4+rnd(4), gap=12, cols=[a,a+gap,a+gap*2+rnd(4)]; return cols.map(c=>(4+rnd(16))*COLS+c); }

const decEyes = str => { const m=/;e:([\d.,]+)$/.exec(str||""); return m?m[1].split(",").map(p=>p.split(".").map(Number)).filter(p=>p.length===2&&p.every(isFinite)).slice(0,2):[]; };
const decCells = str => { str=(str||"").replace(/;e:.*$/,""); const old=!str.startsWith("f:"); if(!old) str=str.slice(2); return decCellsRaw(str,old); };
const decCellsRaw = (str,old) => str.split(",").map(t=>/^(\d+)([stqc])(\d)(\d)$/.exec(t)).filter(Boolean).map(m=>({i:old?oldIdx(+m[1]):+m[1],s:m[2],r:+m[3]%4,c:+m[4],...(old?{z:OLDZ}:{})})).filter(b=>b.i<COLS*ROWS);

function tile(ctx,s,r,x,y,z){
  ctx.beginPath();
  if(s==="c") ctx.arc(x+z/2,y+z/2,z/2,0,7);
  else if(s==="t"){ const P=[[x,y],[x+z,y],[x+z,y+z],[x,y+z]], o=(r+2)%4; P.filter((_,k)=>k!==o).forEach((p,k)=>k?ctx.lineTo(...p):ctx.moveTo(...p)); ctx.closePath(); }
  else if(s==="q"){ const C=[[x,y],[x+z,y],[x+z,y+z],[x,y+z]][r]; ctx.moveTo(...C); ctx.arc(C[0],C[1],z,r*Math.PI/2,(r+1)*Math.PI/2); ctx.closePath(); }
  else ctx.rect(x-.3,y-.3,z+.6,z+.6);
  ctx.fill();
}

// two-tap confirm for anything destructive (the viewer has no confirm dialogs)
const armed={};
const ARM_LABEL={};
function confirmBtn(key,label,ask,cls,action,aria){
  ARM_LABEL[key]=label;
  return `<button class="${cls}" id="cb-${key}" ${aria?`aria-label="${aria}"`:""} onclick="armTap('${key}','${ask}',()=>{${action}})">${label}</button>`;
}
function armTap(key,ask,fn){
  const b=$("#cb-"+key), label=ARM_LABEL[key];
  if(armed[key]){ clearTimeout(armed[key]); armed[key]=0; b.innerHTML=label; b.classList.remove("warn"); fn(); return; }
  b.textContent=ask; b.classList.add("warn");
  armed[key]=setTimeout(()=>{ armed[key]=0; if(b.isConnected){ b.innerHTML=label; b.classList.remove("warn"); } },3000);
}

function starterDots(){
  const pts=[]; while(pts.length<4){ const p=[120+rnd(760), 110+rnd(440)]; if(pts.every(q=>Math.hypot(q[0]-p[0],q[1]-p[1])>170)) pts.push(p); } return pts;
}
// dots where the previous part's lines reach the fold
function foldDots(strokes){
  const xs=[];
  for(const s of strokes){ let best=null; for(let i=0;i<s.length;i+=2){ if(s[i+1]>=FOLD-10 && (!best||s[i+1]>best[1])) best=[s[i],s[i+1]]; } if(best) xs.push(best[0]); }
  xs.sort((a,b)=>a-b); const out=[];
  for(const x of xs){ if(!out.length||x-out[out.length-1]>45) out.push(x); }
  if(!out.length){ return pick([200,340,500,660,800],3).sort((a,b)=>a-b).map(x=>x+rnd(40)-20).map(x=>({x,random:true})); }
  return out.slice(0,7).map(x=>({x}));
}

const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function paint(ctx, strokes, opts={}){
  const BG=opts.light?"#ffffff":css("--card"), INK=opts.light?"#0047ab":css("--ink"), GUIDE=opts.light?"#b4c3e4":css("--guide"), MUTE=opts.light?"#6f83b3":css("--grey");
  const c=ctx.canvas, k=c.width/W;
  ctx.setTransform(1,0,0,1,0,0); if(opts.clear) ctx.clearRect(0,0,c.width,c.height); else { ctx.fillStyle=BG; ctx.fillRect(0,0,c.width,c.height); }
  ctx.setTransform(k,0,0,k,0,0);
  if(opts.guides){
    ctx.strokeStyle=GUIDE; ctx.lineWidth=2; ctx.setLineDash([10,10]);
    if(!opts.last){ ctx.beginPath(); ctx.moveTo(0,FOLD); ctx.lineTo(W,FOLD); ctx.stroke();
      ctx.setLineDash([]); ctx.fillStyle=MUTE; ctx.font="500 20px 'Space Grotesk', sans-serif"; ctx.fillText(T("FOLD · CARRY YOUR LINES DOWN HERE","VOUW · LAAT JE LIJNEN HIER DOORLOPEN"), 20, FOLD+40); }
    ctx.setLineDash([]);
  }
  if(opts.dots){ ctx.fillStyle=INK; for(const d of opts.dots){ ctx.beginPath(); ctx.arc(d.x,10,11,0,7); ctx.fill(); } }
  if(opts.start){ ctx.fillStyle=INK; for(const p of opts.start){ ctx.beginPath(); ctx.arc(p[0],p[1],7,0,7); ctx.fill(); } }
  if(opts.pencil) return pencil(ctx, strokes);
  ctx.lineCap="round"; ctx.lineJoin="round";
  for(let si=0; si<strokes.length; si++){ const s=strokes[si], code=opts.st?.[si]??10, lw=PEN_W[Math.floor(code/10)]??LW, cc=PEN_C[code%10]??"ink";
    ctx.strokeStyle=ctx.fillStyle=cc==="ink"?INK:cc; ctx.lineWidth=lw;
    ctx.beginPath();
    if(s.length<=2){ ctx.arc(s[0],s[1],lw/2,0,7); ctx.fill(); continue; }
    ctx.moveTo(s[0],s[1]);
    for(let i=2;i<s.length-2;i+=2){ const mx=(s[i]+s[i+2])/2, my=(s[i+1]+s[i+3])/2; ctx.quadraticCurveTo(s[i],s[i+1],mx,my); }
    ctx.lineTo(s[s.length-2],s[s.length-1]); ctx.stroke();
  }
}
// graphite look: grainy pattern, thin line, two light passes
let grain=null;
function grainPattern(ctx){
  if(!grain){ grain=document.createElement("canvas"); grain.width=grain.height=48; const g=grain.getContext("2d"), im=g.createImageData(48,48);
    for(let i=0;i<im.data.length;i+=4){ const v=25+Math.random()*60; im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=110+Math.random()*145; } g.putImageData(im,0,0); }
  return ctx.createPattern(grain,"repeat");
}
function pencil(ctx, strokes){
  ctx.strokeStyle=grainPattern(ctx); ctx.lineCap="round"; ctx.lineJoin="round";
  for(let pass=0;pass<2;pass++){
    ctx.lineWidth=pass?3:4.2; ctx.globalAlpha=pass?.55:.85;
    for(const s of strokes){ const o=pass?1.2:0; ctx.beginPath(); ctx.moveTo(s[0]+o,s[1]);
      for(let i=2;i<s.length-2;i+=2){ ctx.quadraticCurveTo(s[i]+o,s[i+1]-o,(s[i]+s[i+2])/2+o,(s[i+1]+s[i+3])/2-o); }
      ctx.lineTo(s[s.length-2]+o,s[s.length-1]); ctx.stroke(); }
  }
  ctx.globalAlpha=1;
}

function sizeCanvas(c){ const r=c.getBoundingClientRect(), d=Math.min(window.devicePixelRatio||1,3), w=Math.min(3000,Math.round(r.width*d)); c.width=w; c.height=Math.round(w*H/W); }

function mountPad(canvas, strokes, opts){
  const ctx=canvas.getContext("2d"); let cur=null, raf=0;
  const st=opts.st||[];
  const redraw=()=>{ raf=0;
    if(opts.blind){ paint(ctx, [], opts); if(cur){ const [x,y]=cur.slice(-2); ctx.strokeStyle=css("--grey"); ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,y,16,0,7); ctx.stroke(); } return; }
    paint(ctx, cur?[...strokes,cur]:strokes, {...opts, st:cur?[...st,penCode()]:st}); };
  const req=()=>{ if(!raf) raf=requestAnimationFrame(redraw); };
  const pos=e=>{ const r=canvas.getBoundingClientRect(); return [ (e.clientX-r.left)/r.width*W, (e.clientY-r.top)/r.height*H ]; };
  canvas.addEventListener("pointerdown",e=>{ if(cur) return; if(opts.canDraw && !opts.canDraw()){ opts.onBlocked?.(); return; } opts.onStart?.(); canvas.setPointerCapture(e.pointerId); cur=pos(e); req(); e.preventDefault(); });
  canvas.addEventListener("pointermove",e=>{ if(!cur) return; const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
    for(const ev of evs){ const [x,y]=pos(ev); const lx=cur[cur.length-2], ly=cur[cur.length-1]; if(Math.hypot(x-lx,y-ly)>3) cur.push(Math.max(0,Math.min(W,x)),Math.max(0,Math.min(H,y))); } req(); });
  const end=()=>{ if(!cur) return; strokes.push(cur); st.push(penCode()); cur=null; req(); opts.onChange?.(); persist(); };
  canvas.addEventListener("pointerup",end); canvas.addEventListener("pointercancel",end);
  new ResizeObserver(()=>{ sizeCanvas(canvas); redraw(); }).observe(canvas);
  return { redraw:req, resize:()=>{ sizeCanvas(canvas); redraw(); }, cancel:()=>{ cur=null; req(); } };
}
// one finished part of a drawing game, pen or blocks; t<1 shows it half-built
function paintPart(ctx, g, i, t=1, extra={}){
  const p=g.turns[i];
  if(isBlocks(g)){ const cells=p.cells||[]; return paintBlocks(ctx, t>=1?cells:cells.slice(0,Math.ceil(cells.length*t)), {seeds:i===0?g.start:null, seedZ:g.oldGrid?OLDZ:1, eyes:t>=1?p.eyes:null, ...extra}); }
  paint(ctx, partial(p.strokes,t), {st:p.st, start:i===0?g.start:null, pencil:g.pencil, ...extra});
}
const colOf = (c,INK) => (PEN_C[c]==null||PEN_C[c]==="ink") ? INK : PEN_C[c];
function paintBlocks(ctx, cells, opts={}){
  const BG=opts.light?"#ffffff":css("--card"), INK=opts.light?"#0047ab":css("--ink"), GUIDE=opts.light?"#b4c3e4":css("--guide"), MUTE=opts.light?"#6f83b3":css("--grey");
  const c=ctx.canvas, k=c.width/W;
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle=BG; ctx.fillRect(0,0,c.width,c.height); ctx.setTransform(k,0,0,k,0,0);
  if(opts.guides){
    ctx.fillStyle=GUIDE; for(let r=1;r<ROWS;r++) for(let q=1;q<COLS;q++) ctx.fillRect(q*CELL-1.5,r*CELL-1.5,3,3);
    if(!opts.last){ ctx.strokeStyle=GUIDE; ctx.lineWidth=2; ctx.setLineDash([10,10]); ctx.beginPath(); ctx.moveTo(0,BFOLD*CELL); ctx.lineTo(W,BFOLD*CELL); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle=MUTE; ctx.font="500 20px 'Space Grotesk', sans-serif"; ctx.fillText(T("FOLD · BUILD INTO THIS ROW","VOUW · BOUW DOOR IN DEZE RIJ"), 20, BFOLD*CELL-12); }

const b64u = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64u = str => Uint8Array.from(atob(str.replace(/-/g,"+").replace(/_/g,"/")), c=>c.charCodeAt(0));
async function pipe(bytes, stream){ const out=await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer(); return new Uint8Array(out); }
async function packGame(g){
  const o={v:1,e:g.edition[0],t:g.theme,n:g.parts,s:startStr(g),p:g.turns.map(t=>[g.edition==="draw"?turnBody(g,t):t.text,t.name||"",t.rule||""])};
  const raw=new TextEncoder().encode(JSON.stringify(o));
  try{ return "z"+b64u(await pipe(raw,new CompressionStream("deflate-raw"))); }catch(e){ return "j"+b64u(raw); }
}
async function unpackGame(str){
  const kind=str[0], bytes=unb64u(str.slice(1));
  const raw = kind==="z" ? await pipe(bytes,new DecompressionStream("deflate-raw")) : bytes;
  const o=JSON.parse(new TextDecoder().decode(raw)), draw=o.e==="d";
  if(![3,4].includes(o.n)) throw new Error("bad game");
  const ps=parseStart(o.s), g={ id:"link", edition:draw?"draw":"words", theme:o.t, parts:o.n, tech:ps.tech, rules:ps.rules, oldGrid:ps.oldGrid, start:ps.start };
  g.turns=o.p.slice(0,o.n).map(([a,name,rule])=>({...(draw?turnFrom(g,String(a)):{text:String(a).slice(0,70)}), name:String(name).slice(0,24), rule:ruleById(rule)?rule:undefined}));
  return g;
}
let LINK="";
const gameLink = () => LINK;
async function makeLink(g){ LINK = location.origin + location.pathname + "#p=" + await packGame(g); return LINK; }
async function routeHash(){
  const gm=/^#g-([a-z0-9]{8})$/.exec(location.hash);
  if(gm && hasDB()){
    S.screen="loading"; render();
    const g=await dbLoad(gm[1]).catch(()=>null);
    if(!g){ S.screen="missing"; render(); return; }
    g.inDB=true; S.mode="remote"; S.game=g; LINK=location.origin+location.pathname+"#g-"+g.id;
    return go(g.turns.length>=g.parts ? "reveal" : "join");
  }
  const m=/^#p=([zj][A-Za-z0-9_-]+)$/.exec(location.hash); if(!m) return;
  try{ const g=await unpackGame(m[1]); S.mode="remote"; S.game=g; LINK=location.href; go(g.turns.length>=g.parts ? "reveal" : "join"); }
  catch(e){ S.screen="missing"; render(); }
}

// a label that would run over two lines gets a smaller letter, step by step, until it fits on one line (or hits the minimum)
function btnWraps(b){
  const tops=[], w=document.createTreeWalker(b,NodeFilter.SHOW_TEXT);
  for(let n; n=w.nextNode();){ if(!n.data.trim()) continue; const rg=document.createRange(); rg.selectNodeContents(n);
    for(const x of rg.getClientRects()) if(x.width>1) tops.push(x.top); }
  return tops.length>0 && Math.max(...tops)-Math.min(...tops)>8;
}
function fitBtns(){
  document.querySelectorAll("#app button.wide").forEach(b=>{
    b.style.fontSize=""; b.style.letterSpacing="";
    if(!btnWraps(b)) return;
    let size=parseFloat(getComputedStyle(b).fontSize); const min=b.classList.contains("solid")?14:12;
    b.style.letterSpacing="1px";
    while(btnWraps(b) && size>min){ size--; b.style.fontSize=size+"px"; }
  });
}

async function apiAll(path){ const out=[]; for(let off=0; off<50000; off+=1000){ const a=await api(path+(path.includes("?")?"&":"?")+"limit=1000&offset="+off); out.push(...(a||[])); if(!a||a.length<1000) break; } return out; }

function dur(ms){ const m=ms/60000; if(m<1) return T("under a minute","minder dan een minuut"); if(m<90) return Math.round(m)+" min"; const h=m/60; if(h<36) return Math.round(h)+T(" hours"," uur"); return Math.round(h/24)+T(" days"," dagen"); }
const median=a=>{ if(!a.length) return null; const b=[...a].sort((x,y)=>x-y), k=b.length>>1; return b.length%2?b[k]:(b[k-1]+b[k])/2; };
async function loadStats(){
  const box=$("#stats"); if(!box) return;
  if(!hasDB()){ box.innerHTML=`<p class="muted">${T("No database connected.","Geen databank verbonden.")}</p>`; return; }
  let games, wall, ai=[], aiw=[];
  try{
    [games, wall]=await Promise.all([apiAll("games?select=id,edition,parts,start,created_at,turns(n,name,created_at)&order=created_at.desc"), apiAll("wall?select=game_id,created_at")]);
    try{ [ai, aiw]=await Promise.all([apiAll("ai_drawings?select=game_id"), apiAll("ai_wall?select=game_id")]); }catch(_){}
  }catch(e){ if(box.isConnected) box.innerHTML=`<p class="muted">${T("Could not load the numbers","De cijfers laden lukte niet")} (${esc(String(e.status||e.message||e))}).</p>`; return; }
  if(!$("#stats")) return;
  const now=Date.now(), DAY=864e5;
  const G=games.map(g=>{ const tu=g.turns||[], st=g.start||""; return { ...g, tu, done:tu.length>=g.parts, kind:g.edition==="words"?"words":(st[0]==="G"||st[0]==="B")?"blocks":"pen", t:Date.parse(g.created_at) }; });
  const started=G.length, finished=G.filter(g=>g.done), parts=G.reduce((a,g)=>a+g.tu.length,0);
  const wallSet=new Set(wall.map(w=>w.game_id)), onWall=wallSet.size;
  const wk=G.filter(g=>now-g.t<7*DAY).length, prevWk=G.filter(g=>now-g.t>=7*DAY&&now-g.t<14*DAY).length;
  const names={}; let signed=0; G.forEach(g=>g.tu.forEach(t=>{ const n=(t.name||"").trim(); if(n){ signed++; const k=n.toLowerCase(); (names[k] ||= {n,c:0}).c++; } }));
  const players=Object.keys(names).length, top=Object.values(names).sort((a,b)=>b.c-a.c).slice(0,5);
  const times=finished.map(g=>Math.max(...g.tu.map(t=>Date.parse(t.created_at)))-g.t).filter(x=>x>=0);
  const med=median(times);
  const kinds=[["pen",T("Drawing · pen + rules","Tekenen · pen + regels")],["blocks",T("Drawing · blocks","Tekenen · blokken")],["words",T("Words","Woorden")]].map(([k,l])=>{ const a=G.filter(g=>g.kind===k); return {l,c:a.length,d:a.filter(g=>g.done).length}; });
  const maxK=Math.max(1,...kinds.map(k=>k.c));
  const reach=[1,2,3,4].map(k=>({k,c:G.filter(g=>g.tu.length>=k).length}));
  // last 14 days, started games per day
  const d0=new Date(); d0.setHours(0,0,0,0);
  const days=Array.from({length:14},(_,i)=>{ const a=d0.getTime()-(13-i)*DAY; return {a,c:G.filter(g=>g.t>=a&&g.t<a+DAY).length}; });
  const maxD=Math.max(1,...days.map(d=>d.c));

    ins.push(T(`${pct(finished.length,started)}% of games get finished: ${nf(finished.length)} of ${nf(started)}.`,`${pct(finished.length,started)}% van de spellen wordt afgewerkt: ${nf(finished.length)} van ${nf(started)}.`));
    const drop=[[1,2],[2,3],[3,4]].map(([a,b])=>({a,lost:G.filter(g=>g.tu.length===a&&!g.done).length})).sort((x,y)=>y.lost-x.lost)[0];
    if(drop.lost>0) ins.push(T(`Most games stop after part ${drop.a}: ${nf(drop.lost)} never got part ${drop.a+1}.`,`De meeste spellen stoppen na deel ${drop.a}: ${nf(drop.lost)} kregen nooit deel ${drop.a+1}.`));
    const fav=[...kinds].sort((a,b)=>b.c-a.c)[0]; if(fav.c) ins.push(T(`Most played: ${fav.l} (${pct(fav.c,started)}% of games).`,`Meest gespeeld: ${fav.l} (${pct(fav.c,started)}% van de spellen).`));
    if(finished.length) ins.push(T(`${pct(onWall,finished.length)}% of finished pieces were published to the wall.`,`${pct(onWall,finished.length)}% van de afgewerkte stukken kwam op de muur.`));
    ins.push(wk>=prevWk ? T(`${nf(wk)} new games this week, ${wk>prevWk?"up from":"same as"} ${nf(prevWk)} the week before.`,`${nf(wk)} nieuwe spellen deze week, ${wk>prevWk?"meer dan":"evenveel als"} de week ervoor (${nf(prevWk)}).`)
      : T(`${nf(wk)} new games this week, down from ${nf(prevWk)} the week before.`,`${nf(wk)} nieuwe spellen deze week, minder dan de week ervoor (${nf(prevWk)}).`));
    if(med!==null) ins.push(T(`A finished game takes ${dur(med)} from first to last part (median).`,`Een afgewerkt spel duurt ${dur(med)} van eerste tot laatste deel (mediaan).`));
  }
  const kpi=(v,l)=>`<div class="kpi"><b>${v}</b><small>${l}</small></div>`;
  $("#stats").innerHTML=`
  <div class="kpis">
    ${kpi(nf(started),T("games started","spellen gestart"))}
    ${kpi(pct(finished.length,started)+"%",T("finished","afgewerkt")+` · ${nf(finished.length)}`)}
    ${kpi(nf(parts),T("parts played","delen gespeeld"))}
    ${kpi(nf(players),T("players who signed","spelers die tekenden"))}
    ${kpi(nf(onWall),T("on the wall","op de muur"))}
    ${kpi(nf(wk),T("games this week","spellen deze week"))}
  </div>
  <div class="stack"><span class="lab">${T("Insights","Inzichten")}</span><div class="insights">${ins.map(x=>`<p>${x}</p>`).join("")}</div></div>
  <div class="stack"><span class="lab">${T("Games started · last 14 days","Spellen gestart · laatste 14 dagen")}</span>
    <div class="days" role="img" aria-label="${T("Games started per day","Spellen gestart per dag")}">${days.map(d=>`<div tabindex="0" title="${fmtD(d.a)}: ${d.c}"><i style="height:${d.c/maxD*100}%"></i></div>`).join("")}</div>
    <div class="daylab"><span>${fmtD(days[0].a)}</span><span>${T("today","vandaag")}</span></div></div>
  <div class="stack"><span class="lab">${T("What people play","Wat mensen spelen")}</span><div class="hbars">
    ${kinds.map(k=>`<div class="hbar" title="${esc(k.l)}: ${k.c} ${T("started","gestart")}, ${k.d} ${T("finished","afgewerkt")}"><span>${esc(k.l)}</span><span>${nf(k.c)} · ${pct(k.d,k.c)}% ${T("finished","af")}</span><div class="tr"><i style="width:${k.c/maxK*100}%"></i></div></div>`).join("")}</div></div>
  <div class="stack"><span class="lab">${T("How far games get","Hoe ver spellen geraken")}</span><div class="hbars">
    ${reach.filter(r=>r.k<4||G.some(g=>g.parts>=4)).map(r=>`<div class="hbar"><span>${T("Reached part","Tot deel")} ${r.k}</span><span>${nf(r.c)} · ${pct(r.c,started)}%</span><div class="tr"><i style="width:${pct(r.c,started)}%"></i></div></div>`).join("")}</div></div>
  <div class="stack"><span class="lab">${T("Extras","Extra")}</span><div class="toplist">
    <div><span>${T("Signed parts","Ondertekende delen")}</span><span>${pct(signed,parts)}%</span></div>
    <div><span>${T("AI pen drawings made","AI-pentekeningen gemaakt")}</span><span>${nf(ai.length)}</span></div>
    <div><span>${T("AI drawings on the wall","AI-tekeningen op de muur")}</span><span>${nf(aiw.length)}</span></div>
    <div><span>${T("Median time to finish","Mediaan tijd tot afgewerkt")}</span><span>${med===null?"–":dur(med)}</span></div></div></div>
  ${top.length?`<div class="stack"><span class="lab">${T("Most active players","Meest actieve spelers")}</span><div class="toplist">${top.map(p=>`<div><span>${esc(p.n)}</span><span>${nf(p.c)} ${T("parts","delen")}</span></div>`).join("")}</div></div>`:""}
  <p class="muted" style="font-size:12px;line-height:1.4">${T("Counts games played over a link (from the first part) and pieces put on the wall. Games played on one phone that were never published are not stored, so they are not counted.","Telt spellen via een link (vanaf het eerste deel) en stukken op de muur. Spellen op één gsm die nooit gepubliceerd werden, worden niet bewaard en tellen dus niet mee.")}</p>`;
}

    <div class="gc"><div class="tools"><div class="row"><button onclick="undo()">${T("Undo","Ongedaan")}</button>${confirmBtn("clear",T("Clear","Wissen"),T("Clear all?","Alles wissen?"),"ghost","clearPad()")}</div>

    const intro = n===0 ? T(`Start from the four dots. Draw the <b>${names[n].toLowerCase()}</b> of a creature.`,`Begin bij de vier stippen. Teken het <b>${names[n].toLowerCase()}</b> van een wezen.`) :

    <div class="stack" style="gap:4px"><span class="lab">${T("Part","Deel")} ${n+1} ${T("of","van")} ${g.parts}</span><h2>${WORD_PARTS[g.parts][n]}</h2></div>
    <p>${(WORD_HELP[g.parts]||WORD_HELP[3])[n][0]}</p>

    ${n>0?`<div class="wordfold">…<b>${esc(prev)}</b></div>`:""}
    <textarea id="txt" maxlength="70" rows="2" placeholder="${esc((WORD_HELP[g.parts]||WORD_HELP[3])[n][1])}" oninput="wordsInput(this)">${esc(d.text)}</textarea>
    ${sign}
    <button class="solid wide" id="done" ${d.text.trim()?"":"disabled"} onclick="finishTurn()">${last?T("Finish and reveal","Klaar, onthul"):T("Fold and pass on","Vouw en geef door")}</button>`;
}
function kwFor(n,t){
  if(n===1) return pick(t.verbs,4);
  if(n===3) return pick(t.places,3);
  return pick(t.adj,2).concat(pick(t.nouns,2));
}

  const apply=()=>{ const w=sheet.clientWidth, h=sheet.clientHeight; if(z<1.03){ z=1; tx=0; ty=0; pan=false; }
    tx=Math.min(0,Math.max(w-w*z,tx)); ty=Math.min(0,Math.max(h-h*z,ty));
    canvas.style.transform=z===1?"":`translate(${tx}px,${ty}px) scale(${z})`; upd();

  const zoomAt=(nz,cx,cy)=>{ nz=Math.max(1,Math.min(MAXZ,nz)); tx=cx-(cx-tx)*nz/z; ty=cy-(cy-ty)*nz/z; z=nz; apply(); };
  const local=e=>{ const r=rect(); return {x:e.clientX-r.left, y:e.clientY-r.top}; };
  const two=()=>{ const [a,b]=[...pts.values()]; return {d:Math.hypot(a.x-b.x,a.y-b.y)||1, x:(a.x+b.x)/2, y:(a.y+b.y)/2}; };

    if(gest && pts.size>=2){ const t=two(), nz=Math.max(1,Math.min(MAXZ,gest.z*t.d/gest.d));

    if(drag){ const p=local(e); tx=drag.tx+p.x-drag.x; ty=drag.ty+p.y-drag.y; apply(); stop(e); return; }
    if(busy) stop(e); },true);
  const up=e=>{ if(!pts.has(e.pointerId)) return; pts.delete(e.pointerId); if(pts.size<2) gest=null; if(!pts.size){ drag=null; if(busy){ busy=false; stop(e); } } else if(busy) stop(e); };

  upd();
  return { step:dir=>{ const w=sheet.clientWidth, h=sheet.clientHeight; zoomAt(dir>0?z*1.6:z/1.6, w/2, h/2); },

  ${g.edition==="words"?aiBlock(g, ex):""}
  <div class="stack">
    <button class="solid wide" onclick="saveImage(this)">${T("Save or send image","Bewaar of stuur afbeelding door")}</button>
    ${g.edition==="words"?`<button class="wide" onclick="copy(wordsText(S.game),this)">${T("Copy the sentence","Kopieer de zin")}</button>`:""}
    ${S.mode==="remote"||ex?`<div class="stack"><span class="lab">${ex?T("Share it","Deel het"):T("Send the reveal to everyone","Stuur de onthulling naar iedereen")}</span>
      ${navigator.share?`<button class="wide" onclick="revealShare(this)">${T("Share…","Delen…")}</button>`:""}
      ${shareGrid(revealMsg(g), LINK, T("Our exquisite corpse is finished","Onze cadavre exquis is klaar"))}</div>`:""}
    <button class="ghost wide" onclick="location.hash='';S.game=null;go('home')">${ex?T("Make your own","Maak je eigen"):T("Play again","Opnieuw spelen")}</button>
  </div></div>`;
}
after.reveal=()=>{
  const g=S.game;
  if(S.mode!=="wall") publishToWall(g);
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  const canv=[...document.querySelectorAll("#rv canvas")];
  const draw=(c,t)=>paintPart(c.getContext("2d"), g, +c.dataset.i, t);
  canv.forEach(c=>{ sizeCanvas(c); draw(c, reduce?1:0); });
  const secs=[...document.querySelectorAll("#rv .sec")];
  secs.forEach((s,i)=>{
    if(reduce){ s.classList.add("open"); return; }
    setTimeout(()=>{ s.classList.add("open"); const c=s.querySelector("canvas"); if(!c) return;
      const t0=performance.now(), D=1100; const step=now=>{ if(!c.isConnected) return; const t=Math.min(1,(now-t0)/D); draw(c, 1-Math.pow(1-t,2)); if(t<1) requestAnimationFrame(step); }; requestAnimationFrame(step); }, 300+i*900);
  });
  const ac=$("#aican"); if(ac){ const fresh=g.ai.fresh&&!reduce; g.ai.fresh=false; paintAI(ac,g,fresh?0:1);
    if(fresh){ const t0=performance.now(), D=2600; const step=now=>{ if(!ac.isConnected) return; const t=Math.min(1,(now-t0)/D); paintAI(ac,g,1-Math.pow(1-t,2)); if(t<1) requestAnimationFrame(step); }; requestAnimationFrame(step); } }
  const cr=document.querySelector(".credits"); if(cr && !reduce){ cr.style.opacity=0; cr.style.transition="opacity .8s"; setTimeout(()=>cr.style.opacity=1, 300+secs.length*900+400); }
};
// the first fraction t of all points, so lines draw themselves in the order they were made
function partial(strokes,t){
  if(t>=1) return strokes; const total=strokes.reduce((a,s)=>a+s.length,0); let left=Math.floor(total*t/2)*2; const out=[];
  for(const s of strokes){ if(left<=0) break; out.push(s.length<=left?s:s.slice(0,Math.max(2,left))); left-=s.length; }
  return out;
}
let spin=0;
function build3d(){
  const g=S.game, rot=$("#rot"), COPIES=5, DEPTH=[0,-38,22,-26];
  g.turns.forEach((t,i)=>{
    const pb=document.createElement("div"); pb.className="pb";
    for(let k=0;k<COPIES;k++){
      const z=DEPTH[i%4]-k*3;
      if(g.edition==="draw"){
        const c=document.createElement("canvas"); c.width=600; c.height=420; if(k) c.className="cp";
        c.style.transform=`translateZ(${z}px)`; pb.appendChild(c);
        paint(c.getContext("2d"), t.strokes, {st:t.st, clear:true, start:i===0?g.start:null, pencil:g.pencil});
      }else{
        const d=document.createElement("div"); d.className="wt"+(k?" cp":""); d.textContent=t.text; d.style.transform=`translateZ(${z}px)`; pb.appendChild(d);
      }
    }
    rot.appendChild(pb);
  });
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let ang=-25, drag=null, id=++spin;
  const obj=$("#obj");
  const tick=()=>{ if(id!==spin||!rot.isConnected) return; if(!drag&&!reduce) ang+=0.35; rot.style.transform=`rotateX(-8deg) rotateY(${ang}deg)`; requestAnimationFrame(tick); };
  obj.addEventListener("pointerdown",e=>{ drag={x:e.clientX,a:ang}; obj.setPointerCapture(e.pointerId); });
  obj.addEventListener("pointermove",e=>{ if(drag) ang=drag.a+(e.clientX-drag.x)*0.6; });
  const up=()=>drag=null; obj.addEventListener("pointerup",up); obj.addEventListener("pointercancel",up);
  rot.style.transform=`rotateX(-8deg) rotateY(${ang}deg)`; tick();
}
const wordsText = g => g.turns.map(t=>t.text).join(" ").replace(/\s+/g," ").trim().replace(/^./,c=>c.toUpperCase()).replace(/([^.!?])$/,"$1.");

async function composeImage(){
  await document.fonts?.ready;
  const g=S.game, M=70, names=g.turns.map((t,i)=>t.name||(T("Player ","Speler ")+(i+1)));
  const c=document.createElement("canvas"); const x=c.getContext("2d");
  if(g.edition==="draw"){
    c.width=W+M*2; c.height=H*g.parts+M*2+60;
    x.fillStyle="#f4f6fb"; x.fillRect(0,0,c.width,c.height);
    g.turns.forEach((t,i)=>{ const sc=document.createElement("canvas"); sc.width=W; sc.height=H; paintPart(sc.getContext("2d"), g, i, 1, {light:true}); x.drawImage(sc,M,M+i*H); });
  }else{
    c.width=1140; const lines=[]; x.font="300 68px 'Space Grotesk', sans-serif";
    g.turns.forEach(t=>{ let line=""; for(const w of t.text.split(/\s+/)){ const tr=(line+" "+w).trim(); if(x.measureText(tr).width>c.width-M*2 && line){ lines.push(line); line=w; } else line=tr; } lines.push(line); lines.push(""); });
    lines.pop(); c.height=M*2+lines.length*80+80;
    x.fillStyle="#f4f6fb"; x.fillRect(0,0,c.width,c.height); x.fillStyle="#0047ab"; x.font="300 68px 'Space Grotesk', sans-serif";
    lines.forEach((l,i)=>x.fillText(l,M,M+60+i*80));
  }
  x.fillStyle="#6f83b3"; x.font="500 20px 'Space Grotesk', sans-serif";
  x.fillText(("GLITCH · "+(g.edition==="draw"&&g.tags?g.theme+" · ":"")+names.join(", ")).toUpperCase(), M, c.height-M+10);
  return new Promise(r=>c.toBlob(r,"image/png"));
}
async function saveImage(btn){
  btn.disabled=true;
  try{
    const blob=await composeImage();
    const file=new File([blob],"glitch.png",{type:"image/png"});
    if(navigator.canShare?.({files:[file]})){ try{ await navigator.share({files:[file]}); }catch(e){} }
    else { const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=file.name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
  }catch(e){ toast(T("The image was not saved.","De afbeelding is niet bewaard.")); }
  btn.disabled=false;
}

async function revealShare(btn){
  const g=S.game; if(!LINK) await makeLink(g);
  shareLink(revealMsg(g)+" "+LINK, btn);
}
function applyTheme(t){ document.documentElement.dataset.theme=t; const b=$("#mode"); if(b) b.setAttribute("aria-label", t==="dark"?T("Switch to light mode","Naar lichte modus"):T("Switch to dark mode","Naar donkere modus"));
  document.querySelector('meta[name="theme-color"]')?.setAttribute("content", t==="dark"?"#0047ab":"#f4f6fb");
  document.querySelectorAll("img[data-mood]").forEach(i=>i.src=moodSrc(i.dataset.mood)); }
function toggleTheme(){ const t=document.documentElement.dataset.theme==="dark"?"light":"dark"; store.set("ec-theme",t); applyTheme(t);
  if(S.screen==="turn") pad?.redraw(); if(S.screen==="intro") render();
  if(S.screen==="admin") render(); if(S.screen==="reveal") render(); }
applyLang();
applyTheme(store.get("ec-theme") || (matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
render();
routeHash();
</script>
